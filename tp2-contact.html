<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Contactez-moi</legend>
            <label>Civilité</label>
            <label for="r1">Monsieur:</label>
            <input id="r1" type="radio" name="genre">
            <label for="r2">Madame:</label>
            <input id="r2" type="radio" name="genre">
            <label for="r3">Mademoiselle:</label>
            <input id="r3" type="radio" name="genre">
            <br><br>

            <label for="t1">Nom:</label>
            <input type="text" id="t1" placeholder="votre nom">
            <label for="t2">Prenom:</label>
            <input type="text" id="t2" placeholder="votre nom">
            
            <br><br>
            <label for="t3">Email:</label>
            <input type="text" id="t3" placeholder="votre email">
            <label for="t4">Tel:</label>
            <input type="text" id="t4" placeholder="votre tel">

            <br><br>
            <label for="t5">Sujet:</label>
            <input type="text" id="t5" placeholder="votre sujet">
            <br><br>
            <label for="t6">Message:</label>
            <br><br>
            <textarea rows="10" cols="30" id="t6"></textarea>
            <br><br>
            <input type="submit" value="envoyer">
            <input type="reset" value="Annuler">

        </fieldset>
    </form>
</body>
</html>
